<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw دروو | نظام التسعير والفواتير</title>
<style>
  :root{
    --purple-900:#241d40;
    --purple-800:#352a5c;
    --purple-700:#453876;
    --purple-600:#5c4d94;
    --purple-300:#c6bbe6;
    --purple-150:#e7e1f5;
    --purple-100:#f2eefb;
    --bg:#eeeaf7;
    --surface:#ffffff;
    --gold:#a9824f;
    --text:#241d40;
    --muted:#7a7290;
    --danger:#a34462;
    --danger-bg:#f7e6ec;
    --success:#3d7a5c;
    --radius:12px;
    --shadow:0 2px 10px rgba(36,29,64,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app{max-width:980px;margin:0 auto;padding:0 16px 80px;}
  .topbar{
    background:linear-gradient(135deg,var(--purple-900),var(--purple-700));
    color:#fff;padding:22px 20px;border-radius:0 0 18px 18px;
    display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 18px;
  }
  .brand{font-size:22px;font-weight:700;letter-spacing:.5px;}
  .brand span{color:var(--purple-300);font-weight:400;margin-inline-start:6px;}
  .tagline{font-size:13px;color:var(--purple-300);}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{
    flex:1;min-width:140px;padding:11px 14px;border:none;border-radius:10px;
    background:var(--surface);color:var(--muted);font-size:14px;font-weight:700;
    cursor:pointer;box-shadow:var(--shadow);transition:.15s;
  }
  .tab.active{background:var(--purple-800);color:#fff;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--purple-800);}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:9px 11px;border:1px solid var(--purple-150);border-radius:8px;
    font-family:inherit;font-size:14px;background:#fbfaff;color:var(--text);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--purple-300);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:150px;}
  .category-block{margin-bottom:14px;}
  .category-title{font-size:14px;font-weight:700;color:var(--purple-700);margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--purple-150);}
  .service-row{
    display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;
  }
  .service-row:hover{background:var(--purple-100);}
  .service-row input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--purple-700);}
  .service-name{flex:1;min-width:120px;}
  .service-name .en{display:block;font-size:11.5px;color:var(--muted);}
  .service-range{font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .qty-input,.price-input{width:70px;flex:none;}
  .price-input{width:90px;}
  .selected-item{
    display:flex;align-items:center;gap:10px;background:var(--purple-100);
    border-radius:8px;padding:8px 10px;margin-bottom:8px;
  }
  .selected-item .nm{flex:1;font-size:13.5px;font-weight:600;}
  .selected-item .sub{font-size:12px;color:var(--muted);}
  .subtotal-badge{font-weight:700;color:var(--purple-800);min-width:70px;text-align:left;}
  .btn{
    padding:10px 16px;border:none;border-radius:9px;font-size:14px;font-weight:700;
    cursor:pointer;transition:.15s;
  }
  .btn-primary{background:var(--purple-800);color:#fff;}
  .btn-primary:hover{background:var(--purple-900);}
  .btn-ghost{background:var(--purple-100);color:var(--purple-800);}
  .btn-ghost:hover{background:var(--purple-150);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .btn-block{width:100%;}
  .rush-toggle{display:flex;align-items:center;gap:8px;background:var(--purple-100);padding:10px 12px;border-radius:9px;font-size:13.5px;}
  .rush-toggle input{width:18px;height:18px;accent-color:var(--gold);}
  .sticky-total{
    position:sticky;bottom:12px;background:var(--purple-900);color:#fff;border-radius:12px;
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 6px 20px rgba(36,29,64,.35);margin-top:14px;

  .sticky-total .num{font-size:20px;font-weight:800;color:var(--purple-300);}
  .msg{font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
  .msg-error{background:var(--danger-bg);color:var(--danger);}
  .msg-success{background:#e5f2eb;color:var(--success);}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}
  .hist-card{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .hist-info .name{font-weight:700;font-size:14.5px;}
  .hist-info .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .hist-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .search-box{margin-bottom:14px;}

  .add-form{border:1px dashed var(--purple-300);border-radius:10px;padding:14px;margin-top:10px;}
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(20,15,40,.55);z-index:50;

  .invoice-actions{display:flex;gap:8px;justify-content:center;padding:14px;background:var(--purple-100);}
  #invoice-print{padding:0;}

<script>
const SITE_PASSWORD = 'Dr123123@';
const AUTH_KEY = 'drow-authed';

function tryLogin(){
  const val = document.getElementById('loginPassInput').value;
  if(val === SITE_PASSWORD){
    try{ localStorage.setItem(AUTH_KEY, '1'); }catch(e){}

(function checkAuth(){

  try{ authed = localStorage.getItem(AUTH_KEY) === '1'; }catch(e){}
  if(authed){
    document.getElementById('loginGate').style.display = 'none';

const STORAGE_KEY = 'drow-pricing-data';

/* ===== تخزين سحابي حقيقي (اختياري) =====
   لو تبين البيانات تكون موحّدة بين كل الأجهزة، انشري كود Google Apps Script
   المرفق، وحطي رابط الـ Web App (ينتهي بـ /exec) ونفس كلمة السر هنا.
   لو تركتيهما فاضيين، النظام يشتغل بالتخزين المحلي على كل جهاز لحاله. */
const REMOTE = {
  url: '',        // مثال: 'https://script.google.com/macros/s/AKfycb.../exec'
  token: 'CHANGE_ME'
};
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const DEFAULT_NOTES = "يشمل السعر 3–4 تعديلات لكل عنصر\nأي تعديل إضافي بعد الاتفاق يُحسب بشكل منفصل\nيُطلب دفع 50% مقدماً لبدء العمل، والباقي عند التسليم";

function defaultDB(){
  return {
    categories: ["تصاميم الأكواب","تصاميم التغليف","الهوية البصرية","إضافات وخدمات أخرى"],
    catalog: [
      {id:uid(),category:"تصاميم الأكواب",nameAr:"تصميم كوب بسيط (نص + عنصر بسيط)",nameEn:"Simple Cup Design",min:150,max:200,price:175,usage:0},
      {id:uid(),category:"تصاميم الأكواب",nameAr:"تصميم كوب برسمة مخصصة (رسمة خفيفة)",nameEn:"Custom Illustration Cup",min:300,max:400,price:350,usage:0},
      {id:uid(),category:"تصاميم الأكواب",nameAr:"تصميم كوب احترافي كامل (فكرة + هوية)",nameEn:"Premium Cup Design",min:700,max:900,price:800,usage:0},
      {id:uid(),category:"تصاميم التغليف",nameAr:"تصميم استيكر / لبيل",nameEn:"Sticker / Label Design",min:200,max:250,price:225,usage:0},
      {id:uid(),category:"تصاميم التغليف",nameAr:"تصميم علبة (Box)",nameEn:"Box Design",min:250,max:300,price:275,usage:0},
      {id:uid(),category:"تصاميم التغليف",nameAr:"تصميم كيس / Sleeve",nameEn:"Bag / Sleeve Design",min:250,max:300,price:275,usage:0},
      {id:uid(),category:"الهوية البصرية",nameAr:"تصميم شعار فقط",nameEn:"Logo Design Only",min:400,max:800,price:600,usage:0},
      {id:uid(),category:"الهوية البصرية",nameAr:"هوية بصرية مصغرة (شعار + ألوان + خط)",nameEn:"Mini Brand Identity",min:900,max:1500,price:1200,usage:0},
      {id:uid(),category:"الهوية البصرية",nameAr:"هوية بصرية كاملة",nameEn:"Full Brand Identity",min:2000,max:6000,price:4000,usage:0},
      {id:uid(),category:"إضافات وخدمات أخرى",nameAr:"تعديل إضافي بعد الاتفاق",nameEn:"Additional revision",min:30,max:50,price:40,usage:0}
    ],
    quotations: []
  };
}

let db = null;
let draft = null;

function newDraft(){
  return { clientName:'', date: todayISO(), rush:false, items: [], notes: DEFAULT_NOTES };
}

/* Storage layer: uses Claude's artifact storage when available (inside claude.ai),
   and falls back to the browser's localStorage when the file is opened directly
   (double-clicked / hosted anywhere else), so the app always saves data. */
const hasClaudeStorage = () => (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');

async function storageGet(key){
  if(REMOTE.url){
    try{
      const res = await fetch(`${REMOTE.url}?token=${encodeURIComponent(REMOTE.token)}`, { method:'GET' });
      const text = await res.text();
      if(text) return text;
    }catch(e){ console.error('remote load failed, using local copy', e); }
  }
  if(hasClaudeStorage()){
    try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}

async function storageSet(key, value){
  let remoteOk = !REMOTE.url;
  if(REMOTE.url){
    try{
      await fetch(`${REMOTE.url}?token=${encodeURIComponent(REMOTE.token)}`, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: value
      });
      remoteOk = true;
    }catch(e){ console.error('remote save failed, kept local copy only', e); }
  }
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); }catch(e){}
  }
  try{ localStorage.setItem(key, value); }catch(e){}
  return remoteOk;
}

async function loadDB(){
  const raw = await storageGet(STORAGE_KEY);
  try{ db = raw ? JSON.parse(raw) : defaultDB(); }
  catch(e){ db = defaultDB(); }
  if(!db.categories) db.categories = ["تصاميم الأكواب","تصاميم التغليف","الهوية البصرية","إضافات وخدمات أخرى"];
  if(!Array.isArray(db.catalog)) db.catalog = defaultDB().catalog;
  if(!Array.isArray(db.quotations)) db.quotations = [];
  draft = newDraft();
}

async function saveDB(){
  await storageSet(STORAGE_KEY, JSON.stringify(db));
}

function money(n){ return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0}) + ' ر.س'; }

/* ---------------- TABS ---------------- */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='history') renderHistory();
    if(btn.dataset.tab==='catalog') renderCatalogTab();
  });
});

/* ---------------- NEW QUOTATION RENDER ---------------- */
function categorySelectOptions(selectEl, selectedVal){
  selectEl.innerHTML = db.categories.map(c=>`<option value="${escapeHtml(c)}" ${c===selectedVal?'selected':''}>${escapeHtml(c)}</option>`).join('');
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderServiceSelector(){
  const wrap = document.getElementById('serviceSelector');
  const byCat = {};
  db.categories.forEach(c=>byCat[c]=[]);
  db.catalog.forEach(item=>{ (byCat[item.category] = byCat[item.category]||[]).push(item); });
  let html = '';
  db.categories.forEach(cat=>{
    const items = byCat[cat]||[];
    if(!items.length) return;
    items.sort((a,b)=>(b.usage||0)-(a.usage||0));
    html += `<div class="category-block"><div class="category-title">${escapeHtml(cat)}</div>`;
    items.forEach(item=>{
      const checked = draft.items.some(i=>i.catalogId===item.id);
      html += `<div class="service-row">
        <input type="checkbox" data-id="${item.id}" class="svc-check" ${checked?'checked':''}>
        <div class="service-name">${escapeHtml(item.nameAr)}${item.nameEn?`<span class="en">${escapeHtml(item.nameEn)}</span>`:''}</div>
        <div class="service-range">${item.min}–${item.max} ر.س</div>
      </div>`;
    });
    html += `</div>`;
  });
  wrap.innerHTML = html || '<div class="empty">لا توجد خدمات بعد. أضف خدمة من الأسفل.</div>';
  wrap.querySelectorAll('.svc-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const item = db.catalog.find(x=>x.id===cb.dataset.id);
      if(cb.checked){
        draft.items.push({catalogId:item.id, nameAr:item.nameAr, nameEn:item.nameEn, qty:1, price:item.price});
      }else{
        draft.items = draft.items.filter(i=>i.catalogId!==item.id);
      }
      renderSelectedList();
    });
  });
}

function renderSelectedList(){
  const wrap = document.getElementById('selectedList');
  if(!draft.items.length){
    wrap.innerHTML = '<div class="empty">لم تختر أي خدمة بعد</div>';
  }else{
    wrap.innerHTML = draft.items.map((it,idx)=>`
      <div class="selected-item">
        <div class="nm">${escapeHtml(it.nameAr)}<div class="sub">${it.nameEn?escapeHtml(it.nameEn):''}</div></div>
        <input type="number" min="1" class="qty-input" value="${it.qty}" data-idx="${idx}" data-field="qty">
        <input type="number" min="0" class="price-input" value="${it.price}" data-idx="${idx}" data-field="price">
        <div class="subtotal-badge">${money(it.qty*it.price)}</div>
        <button class="btn btn-danger btn-sm" data-remove="${idx}">حذف</button>
      </div>
    `).join('');
    wrap.querySelectorAll('input[data-field]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const idx = +inp.dataset.idx, field = inp.dataset.field;
        draft.items[idx][field] = Math.max(field==='qty'?1:0, Number(inp.value)||0);
        renderSelectedList();
      });
    });
    wrap.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = +btn.dataset.remove;
        draft.items.splice(idx,1);
        renderServiceSelector();
        renderSelectedList();
      });
    });
  }
  updateTotal();
}

function computeSubtotal(items){ return items.reduce((s,i)=>s+i.qty*i.price,0); }

function updateTotal(){
  const subtotal = computeSubtotal(draft.items);
  const rushAmount = draft.rush ? subtotal*0.5 : 0;
  document.getElementById('totalDisplay').textContent = money(subtotal+rushAmount);
}

document.getElementById('rushCheck').addEventListener('change', (e)=>{ draft.rush = e.target.checked; updateTotal(); });
document.getElementById('clientName').addEventListener('input', e=> draft.clientName = e.target.value);
document.getElementById('quoteDate').addEventListener('input', e=> draft.date = e.target.value);

document.getElementById('showAddServiceBtn').addEventListener('click', ()=>{
  const form = document.getElementById('quickAddForm');
  form.style.display = form.style.display==='none' ? 'block' : 'none';
  categorySelectOptions(document.getElementById('qa_category'));
});
document.getElementById('qa_cancel').addEventListener('click', ()=>{
  document.getElementById('quickAddForm').style.display='none';
});
document.getElementById('qa_confirm').addEventListener('click', async ()=>{
  const nameAr = document.getElementById('qa_nameAr').value.trim();
  const nameEn = document.getElementById('qa_nameEn').value.trim();
  const category = document.getElementById('qa_category').value;
  const price = Number(document.getElementById('qa_price').value)||0;
  if(!nameAr || price<=0){ showMsg('new-msg','يرجى إدخال اسم الخدمة والسعر','error'); return; }
  const newItem = {id:uid(), category, nameAr, nameEn, min:price, max:price, price, usage:0};
  db.catalog.push(newItem);
  await saveDB();
  draft.items.push({catalogId:newItem.id, nameAr, nameEn, qty:1, price});
  document.getElementById('qa_nameAr').value='';
  document.getElementById('qa_nameEn').value='';
  document.getElementById('qa_price').value='';
  document.getElementById('quickAddForm').style.display='none';
  renderServiceSelector();
  renderSelectedList();
  showMsg('new-msg','تمت إضافة الخدمة إلى القائمة وسيتم تذكرها للمرات القادمة','success');
});

function showMsg(elId, text, type){
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="msg msg-${type}">${escapeHtml(text)}</div>`;
  setTimeout(()=>{ el.innerHTML=''; }, 3500);
}

document.getElementById('notesArea').addEventListener('input', e=> draft.notes = e.target.value);

document.getElementById('saveQuoteBtn').addEventListener('click', async ()=>{
  if(!draft.clientName.trim()){ showMsg('new-msg','يرجى إدخال اسم العميل','error'); return; }
  if(!draft.items.length){ showMsg('new-msg','يرجى اختيار خدمة واحدة على الأقل','error'); return; }
  const subtotal = computeSubtotal(draft.items);
  const rushAmount = draft.rush ? subtotal*0.5 : 0;
  const quotation = {
    id: uid(),
    clientName: draft.clientName.trim(),
    date: draft.date || todayISO(),
    items: draft.items.map(i=>({...i})),
    rush: draft.rush,
    notes: draft.notes,
    subtotal, rushAmount, total: subtotal+rushAmount,
    createdAt: new Date().toISOString()
  };
  db.quotations.unshift(quotation);
  // bump usage counters
  draft.items.forEach(it=>{
    const cat = db.catalog.find(c=>c.id===it.catalogId);
    if(cat) cat.usage = (cat.usage||0)+1;
  });
  await saveDB();
  openInvoice(quotation);
  resetDraftUI();
});

function resetDraftUI(){
  draft = newDraft();
  document.getElementById('clientName').value='';
  document.getElementById('quoteDate').value = draft.date;
  document.getElementById('rushCheck').checked=false;
  document.getElementById('notesArea').value = draft.notes;
  renderServiceSelector();
  renderSelectedList();
}

/* ---------------- INVOICE PREVIEW ---------------- */
function invoiceHTML(q){
  const rows = q.items.map(it=>`
    <tr>
      <td class="name">${escapeHtml(it.nameAr)}${it.nameEn?`<span class="en">${escapeHtml(it.nameEn)}</span>`:''}</td>
      <td style="text-align:center;">${it.qty}</td>
      <td style="text-align:center;">${money(it.price)}</td>
      <td style="text-align:center;font-weight:700;">${money(it.qty*it.price)}</td>
    </tr>`).join('');
  const rushRow = q.rush ? `<tr><td class="name">رسوم الاستعجال (+50%)</td><td colspan="3" style="text-align:center;font-weight:700;">${money(q.rushAmount)}</td></tr>` : '';
  const notesRows = (q.notes||'').split('\n').filter(Boolean).map(n=>`<div class="inv-note"><span class="dot">●</span><span>${escapeHtml(n)}</span></div>`).join('');
  return `
    <div class="inv-header">Draw دروو</div>
    <div class="inv-body">
      <div class="inv-title"><h1>عرض سعر فني</h1><div class="sub">QUOTATION</div></div>
      <div class="inv-meta">
        <div>التاريخ: ${fmtDate(q.date)}</div>
        <div>اسم العميل: ${escapeHtml(q.clientName)}</div>
      </div>
      <table class="inv-table">
        <thead><tr><th style="text-align:right;">الخدمة</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
        <tbody>${rows}${rushRow}</tbody>
      </table>
      <div class="inv-total"><div>الإجمالي الكلي</div><div>${money(q.total)}</div></div>
      <div class="inv-notes-title">الشروط والملاحظات</div>
      ${notesRows}
    </div>
    <div class="inv-footer">شكراً لثقتكم بنا</div>
  `;
}

let currentInvoiceQuote = null;

function openInvoice(q){
  currentInvoiceQuote = q;
  document.getElementById('invoice-print').innerHTML = invoiceHTML(q);
  document.getElementById('invoiceOverlay').classList.add('active');
}
document.getElementById('closeInvoiceBtn').addEventListener('click', ()=>{
  document.getElementById('invoiceOverlay').classList.remove('active');
});
document.getElementById('printInvoiceBtn').addEventListener('click', ()=> {
  try{ window.print(); }
  catch(e){ alert('يبدو أن الطباعة غير متاحة هنا، جرّبي زر "تحميل PDF" بدلاً منها.'); }
});

document.getElementById('downloadPdfBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadPdfBtn');
  const originalText = btn.textContent;
  if(typeof html2canvas==='undefined' || !window.jspdf){
    alert('تعذّر تحميل أدوات إنشاء PDF (يحتاج اتصال بالإنترنت). جرّبي زر "طباعة" بدلاً منها.');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'جاري التجهيز...';
  try{
    const el = document.getElementById('invoice-print');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdfWidth = 500; // pt, close to a comfortable document width
    const pdfHeight = canvas.height * pdfWidth / canvas.width;
    const pdf = new jsPDF({
      orientation: pdfHeight > pdfWidth ? 'p' : 'l',
      unit: 'pt',
      format: [pdfWidth, pdfHeight]
    });
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    const clientSafe = (currentInvoiceQuote?.clientName || 'عرض_سعر').replace(/[^\u0600-\u06FFa-zA-Z0-9 ]/g,'').trim() || 'عرض_سعر';
    pdf.save(`عرض سعر - ${clientSafe}.pdf`);
  }catch(e){
    console.error(e);
    alert('صار خطأ أثناء إنشاء الملف. جرّبي زر "طباعة" كبديل.');
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

/* ---------------- HISTORY ---------------- */
function renderHistory(){
  const wrap = document.getElementById('historyList');
  const q = (document.getElementById('searchClient').value||'').trim();
  let list = db.quotations;
  if(q) list = list.filter(x=>x.clientName.includes(q));
  if(!list.length){ wrap.innerHTML = '<div class="empty">لا توجد عروض أسعار محفوظة بعد</div>'; return; }
  wrap.innerHTML = list.map(item=>`
    <div class="hist-card">
      <div class="hist-info">
        <div class="name">${escapeHtml(item.clientName)}</div>
        <div class="meta">${fmtDate(item.date)} • ${item.items.length} خدمة • ${money(item.total)}</div>
      </div>
      <div class="hist-actions">
        <button class="btn btn-ghost btn-sm" data-view="${item.id}">عرض / طباعة</button>
        <button class="btn btn-ghost btn-sm" data-dup="${item.id}">نسخ كعرض جديد</button>
        <button class="btn btn-danger btn-sm" data-del="${item.id}">حذف</button>
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', ()=>{
    const q2 = db.quotations.find(x=>x.id===b.dataset.view);
    if(q2) openInvoice(q2);
  }));
  wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('هل تريد حذف هذا العرض نهائياً؟')) return;
    db.quotations = db.quotations.filter(x=>x.id!==b.dataset.del);
    await saveDB();
    renderHistory();
  }));
  wrap.querySelectorAll('[data-dup]').forEach(b=>b.addEventListener('click', ()=>{
    const src = db.quotations.find(x=>x.id===b.dataset.dup);
    if(!src) return;
    draft = { clientName: src.clientName, date: todayISO(), rush: src.rush, items: src.items.map(i=>({...i})), notes: src.notes };
    document.querySelector('.tab[data-tab="new"]').click();
    document.getElementById('clientName').value = draft.clientName;
    document.getElementById('quoteDate').value = draft.date;
    document.getElementById('rushCheck').checked = draft.rush;
    document.getElementById('notesArea').value = draft.notes;
    renderServiceSelector();
    renderSelectedList();
    showMsg('new-msg','تم نسخ عرض سابق بتاريخ اليوم — عدّل ما تحتاج ثم احفظ','success');
  }));
}
document.getElementById('searchClient').addEventListener('input', renderHistory);

/* ---------------- CATALOG MANAGEMENT ---------------- */
function renderCatalogTab(){
  const wrap = document.getElementById('catalogWrap');
  const byCat = {};
  db.categories.forEach(c=>byCat[c]=[]);
  db.catalog.forEach(item=>{ (byCat[item.category]=byCat[item.category]||[]).push(item); });
  let html = '';
  db.categories.forEach(cat=>{
    const items = byCat[cat]||[];
    html += `<div class="card"><h3>${escapeHtml(cat)}</h3>`;
    if(!items.length){ html += `<div class="empty">لا توجد خدمات في هذا التصنيف</div>`; }
    items.forEach(item=>{
      html += `<div class="cat-item-row">
        <div class="nm">${escapeHtml(item.nameAr)}<span class="usage-badge">استُخدم ${item.usage||0} مرة</span></div>
        <input class="rng" type="number" data-id="${item.id}" data-f="min" value="${item.min}" title="أقل سعر">
        <input class="rng" type="number" data-id="${item.id}" data-f="max" value="${item.max}" title="أعلى سعر">
        <input class="rng" type="number" data-id="${item.id}" data-f="price" value="${item.price}" title="السعر الافتراضي">
        <button class="btn btn-danger btn-sm" data-catdel="${item.id}">حذف</button>
      </div>`;
    });
    html += `</div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('input[data-f]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const item = db.catalog.find(x=>x.id===inp.dataset.id);
      if(item){ item[inp.dataset.f] = Number(inp.value)||0; await saveDB(); }
    });
  });
  wrap.querySelectorAll('[data-catdel]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('حذف هذه الخدمة من القائمة؟')) return;
    db.catalog = db.catalog.filter(x=>x.id!==b.dataset.catdel);
    await saveDB();
    renderCatalogTab();
  }));
  categorySelectOptions(document.getElementById('cat_category'));
}

document.getElementById('cat_addBtn').addEventListener('click', async ()=>{
  const nameAr = document.getElementById('cat_nameAr').value.trim();
  const nameEn = document.getElementById('cat_nameEn').value.trim();
  const newCategory = document.getElementById('cat_newCategory').value.trim();
  const category = newCategory || document.getElementById('cat_category').value;
  const min = Number(document.getElementById('cat_min').value)||0;
  const max = Number(document.getElementById('cat_max').value)||min;
  const price = Number(document.getElementById('cat_default').value)|| min;
  if(!nameAr || min<=0){ alert('يرجى إدخال اسم الخدمة والسعر'); return; }
  if(newCategory && !db.categories.includes(newCategory)) db.categories.push(newCategory);
  db.catalog.push({id:uid(), category, nameAr, nameEn, min, max, price, usage:0});
  await saveDB();
  ['cat_nameAr','cat_nameEn','cat_newCategory','cat_min','cat_max','cat_default'].forEach(id=>document.getElementById(id).value='');
  renderCatalogTab();
});

/* ---------------- INIT ---------------- */
(async function init(){
  await loadDB();
  await saveDB();
  const statusEl = document.getElementById('storageStatus');
  if(REMOTE.url){
    statusEl.textContent = '☁️ متصل بالتخزين السحابي المشترك';
  }else if(hasClaudeStorage()){
    statusEl.textContent = 'يحفظ داخل Claude';
  }else{
    statusEl.textContent = '💾 يحفظ محلياً على هذا الجهاز فقط';
  }
  document.getElementById('quoteDate').value = draft.date;
  document.getElementById('notesArea').value = draft.notes;
  renderServiceSelector();
  renderSelectedList();
})();
</script>
